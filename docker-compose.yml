# docker-compose.yml - LinSolve Development Environment
# Orchestrates backend (FastAPI) and frontend (Astro) services

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linsolve-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - linsolve-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: linsolve-frontend
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linsolve-network
    restart: unless-stopped

networks:
  linsolve-network:
    driver: bridge